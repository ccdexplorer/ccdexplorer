[project]
name = "ccdexplorer-og-cards"
version = "0.1.0"
description = "Social preview cards for ccdexplorer links, rendered at the edge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 10.1 is the floor: it is the release where ImageFont.load_default grew a
    # size argument, which is what lets the card use a scalable font without
    # shipping a font file.
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
