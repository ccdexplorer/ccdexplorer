repos:
  - repo: local
    hooks:
      - id: just-test
        name: run test suite (just test)
        entry: just test
        language: system
        pass_filenames: false
        always_run: true

      - id: e2e-on-html-change
        name: run Playwright e2e tests (staged .html files present)
        entry: just e2e
        language: system
        pass_filenames: false
        files: \.html$
