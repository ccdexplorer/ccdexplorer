{% include 'base/tabulator/tabulator-custom-formatters.html' %}

<script>
  const {{ccd_tabulator_table}}_columns = [
  {
        title: "Height", field: "block_height",
        minWidth: 88,
        // maxWidth: 120,
        responsive: 0,
        accessorDownload: (value, data) => data.block_height_download,
        formatter: "html",
        headerSort: false,
        hozAlign: "left", headerHozAlign: "left",
        
      },
      {
        title: "Time", field: "payday_block_slot_time",
        minWidth: 84,
        maxWidth: 170,
        responsive: 0,
        accessorDownload: (value, data) => data.payday_block_slot_time_download,
        formatter: isoDateWithOptionalTimeFormatter,
        // Header follows the cell: "Date" while only the date is rendered,
        // "Time" from md up where the clock time appears. The plain `title`
        // above is what the CSV export uses, and that always has the full
        // timestamp, so it stays "Time".
        titleFormatter: function() {
          return `<span class="d-md-none">Date</span>` +
                 `<span class="d-none d-md-inline">Time</span>`;
        },
        headerSort:false,
        hozAlign: "right", headerHozAlign: "right",
        
      },
      {
        title: "Blocks", field: "count_of_blocks",
        minWidth: 62,
        maxWidth: 100,
        responsive: 0,
        formatter: ccdClassFormatter,
        headerSort:false,
        hozAlign: "right", headerHozAlign: "right",

      },
      {
        title: "Missed", field: "missed_rounds",
        minWidth: 62,
        maxWidth: 100,
        responsive: 0,
        headerSort: false,
        hozAlign: "right", headerHozAlign: "right",
        formatter: function(cell) {
          const value = cell.getValue();
          if (value === null || value === undefined) {
            cell.getElement().title = "No round data recorded for this payday.";
            return `<span class="ccd">-</span>`;
          }
          const formatted = value.toLocaleString("en-US");
          const row = cell.getRow().getData();
          // Rounds whose leader produced no block, so Blocks + Missed is the
          // payday's round count. If some epochs are unrecorded the sum is a
          // floor, not the exact figure -- say so rather than imply precision.
          if (row.epochs_covered < row.epochs_expected) {
            cell.getElement().title =
              "Based on " + row.epochs_covered + " of " + row.epochs_expected +
              " epochs in this payday; the rest were not recorded.";
            return `<span class="ccd">${formatted}*</span>`;
          }
          cell.getElement().title = "Rounds whose elected validator produced no block.";
          return `<span class="ccd">${formatted}</span>`;
        },
      },

    ];

  
  
  window["{{ccd_tabulator_table}}_columns"] = {{ccd_tabulator_table}}_columns;
  window["{{ccd_tabulator_table}}_filename"] = '{{filename}}';
</script>

<!-- Height for the running payday row. Polled on the same 2s cadence as the
     blocks table, and just as cheap: the endpoint reads the last finalized
     height the scheduler already keeps in memory, so there is no gRPC call and
     no query behind it. -->
<span id="{{ccd_tabulator_table}}_head_height"
      hidden
      hx-get="/{{net}}/ajax_last_finalized_height"
      hx-trigger="load, every 2s"></span>

<script>
  (function () {
    const table = window["{{ccd_tabulator_table}}_table"];
    if (!table) return;

    // Tabulator draws its cells itself, long after htmx scanned the page, so
    // the breathing dot in the live row is inert until htmx is pointed at it.
    table.on("renderComplete", function () {
      if (window.htmx) window.htmx.process(table.element);
    });

    // The running row is the only one whose height moves. Rather than re-fetch
    // the page for it, take the polled height and derive the row from the
    // payday's own start height, which the server sends with the row.
    document.body.addEventListener("htmx:afterSwap", function (event) {
      if (!event.target || event.target.id !== "{{ccd_tabulator_table}}_head_height") return;
      const height = parseInt(event.target.textContent.trim(), 10);
      if (!Number.isFinite(height) || height <= 0) return;

      const rows = table.getRows();
      if (!rows.length) return;
      const row = rows[0];
      const data = row.getData();
      if (!data.is_current || !data.height_for_first_block) return;
      if (height < data.height_for_first_block) return;   // payday just rolled over

      row.update({
        count_of_blocks: height - data.height_for_first_block + 1,
        block_height_download: height,
        block_height:
          '<a href="/{{net}}/block/' + height + '"><span class="ccd">' +
          height.toLocaleString("en-US") + "</span></a>" +
          ' <img hx-ext="class-tools" class="breathing" classes="toggle faded:1s"' +
          ' width="10px" src="/static/misc/green_dot.png"/>',
      });
    });

    // The client cannot see a payday close -- it would keep counting into the
    // next one off a stale start height. A slow full refresh picks up the new
    // boundary, and page one only, so paging is never yanked away.
    setInterval(function () {
      if (document.hidden) return;
      if (typeof table.getPage === "function" && table.getPage() !== 1) return;
      Promise.resolve(table.replaceData()).catch(function () {});
    }, 60000);
  })();
</script>
