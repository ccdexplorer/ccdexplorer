{% include 'base/tabulator/tabulator-custom-formatters.html' %}

<script>
  const {{ccd_tabulator_table}}_columns = [
  {
        title: "Height", field: "block_height", 
        minWidth: 120,
        // maxWidth: 120,
        responsive: 0,
        accessorDownload: (value, data) => data.block_height_download,
        formatter: "html",
        headerSort: false,
        hozAlign: "left", headerHozAlign: "left",
        
      },
      {
        title: "Time", field: "payday_block_slot_time", 
        minWidth: 170,
        maxWidth: 170,
        responsive: 50,
        accessorDownload: (value, data) => data.payday_block_slot_time_download,
        formatter: isoDateTimeFormatter,
        headerSort:false,
        hozAlign: "right", headerHozAlign: "right",
        
      },
      {
        title: "Blocks", field: "count_of_blocks",
        minWidth: 100,
        maxWidth: 100,
        responsive: 50,
        formatter: ccdClassFormatter,
        headerSort:false,
        hozAlign: "right", headerHozAlign: "right",

      },
      {
        title: "Missed", field: "missed_rounds",
        minWidth: 90,
        maxWidth: 100,
        responsive: 0,
        headerSort: false,
        hozAlign: "right", headerHozAlign: "right",
        formatter: function(cell) {
          const value = cell.getValue();
          if (value === null || value === undefined) {
            cell.getElement().title = "No round data recorded for this payday.";
            return `<span class="ccd">-</span>`;
          }
          const formatted = value.toLocaleString("en-US");
          const row = cell.getRow().getData();
          // Rounds whose leader produced no block, so Blocks + Missed is the
          // payday's round count. If some epochs are unrecorded the sum is a
          // floor, not the exact figure -- say so rather than imply precision.
          if (row.epochs_covered < row.epochs_expected) {
            cell.getElement().title =
              "Based on " + row.epochs_covered + " of " + row.epochs_expected +
              " epochs in this payday; the rest were not recorded.";
            return `<span class="ccd">${formatted}*</span>`;
          }
          cell.getElement().title = "Rounds whose elected validator produced no block.";
          return `<span class="ccd">${formatted}</span>`;
        },
      },

    ];

  
  
  window["{{ccd_tabulator_table}}_columns"] = {{ccd_tabulator_table}}_columns;
  window["{{ccd_tabulator_table}}_filename"] = '{{filename}}';
</script>
