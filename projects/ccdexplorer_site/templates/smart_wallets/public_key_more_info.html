<table class="table table-borderless">
    <tr class="table-row-line-height sm-text">
        <td class="text-start">Belongs to</td>
        <td class="text-end"><a href="/{{net}}/contract/{{index}}/{{subindex}}"  title="{{wallet_contract_address}}">
            {{smart_wallets.get(wallet_contract_address,{"name": ""}).name}}
        </a>
    </td> 
    </tr>
    
    <tr class="table-row-line-height sm-text">
        <td class="text-start">CCD Balance</td>
        <td class="text-end">
            {{ balance_ccd.get("ccd", {}).get("balance", 0) | micro_ccd_display | safe}}
            
            </td>
    </tr>
    <tr class="table-row-line-height sm-text">
        <td class="text-start">CIS-2 Tokens</td>
        <td class="text-end">{% if cis2_tokens_available %}Yes{% else %}No{% endif %}</td>
            
        
    </td> 
    </tr>

</tbody>
</table>
