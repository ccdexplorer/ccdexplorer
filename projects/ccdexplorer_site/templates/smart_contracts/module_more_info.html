<table class="table table-borderless">
    
    
    <tr class="table-row-line-height sm-text">
        <td class="text-start">Deployed in block</td>
        <td class="text-end ccd">{{tx_deployed.block_info.height|round_x_decimal_with_comma(0)}}
            
            </td>
    </tr>
    <tr class="table-row-line-height sm-text">
        <td class="text-start">Deployed in tx</td>
        <td class="text-end"><span style="font-family: monospace, monospace;">{{tx_deployed.hash|tx_hash_link(net)|safe}}</span>
            
            </td>
    </tr>
    
    <tr class="table-row-line-height sm-text">
        <td class="text-start">Methods</td>
        <td class="text-end ccd">{% if module.methods %}{{module.methods|length}}{% else %}0{% endif %}

            </td>
    </tr>
    <tr class="table-row-line-height sm-text">
        <td class="text-start">Contracts</td>
        <td class="text-end ccd">{{module_instance_count}}</td>
    </tr>
    
</tbody>
</table>
