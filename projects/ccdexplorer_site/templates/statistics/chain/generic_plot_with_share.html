

{# The configurable page for this chart, if one exists. A tile whose chart
   has no page is left unlinked rather than pointed somewhere approximate. #}
{% set _spec = spec_for_plot(plot_name) %}
{% set page_slug = _spec.page_slug if _spec and _spec.has_page else None %}

<div class="position-relative">
  <button
    type="button"
    class="btn btn-sm position-absolute top-0 start-0 me-2 d-none"
    style="z-index: 5;"
    data-share-url="{{ env.SITE_URL }}/plots/{{ net }}/{{plot_name}}"
    onclick="sharePlot(this)"
    id="share-btn-{{plot_name}}"
  >
    <i class="bi bi-share-fill"></i>
  </button>

  {% if page_slug %}
    <a
      href="/{{ net }}/charts/{{ page_slug }}"
      class="btn btn-sm position-absolute top-0 end-0 ms-2"
      style="z-index: 5;"
      title="Configure this chart"
    >
      <i class="bi bi-sliders"></i>
    </a>
  {% endif %}

  <div
    id="plot-{{plot_name}}"
    hx-trigger="load, switched-theme from:body"
    hx-post="{{ env.SITE_URL }}/{{ net }}/{{ajax_url}}"
    hx-vals='js:{theme: document.querySelector("html").getAttribute("data-bs-theme")}'
  ></div>
</div>

<script>
  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.target && e.target.id === "plot-{{plot_name}}") {
      document.getElementById("share-btn-{{plot_name}}")?.classList.remove("d-none");
    }
  });
</script>
