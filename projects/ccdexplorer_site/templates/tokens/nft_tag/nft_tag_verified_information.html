

<table class="table table-borderless">
        <tr class="table-row-line-height sm-text">
            <td class="text-start">Display Name</td>
            <td class="text-end">{{ vi.display_name }} <img width="20px;"src="{{vi.logo_url}}"></td>
        </tr>
        <tr class="table-row-line-height sm-text">
            <td class="text-start">Token Type</td>
            <td class="text-end word-break">{{ vi.token_type.capitalize() }}                
                </td>
        </tr>
        {% if vi.owner !="other" %}
        <tr class="table-row-line-height sm-text">
            <td class="text-start">Owner</td>
            <td class="text-end">{{vi.owner}}
                
                </td>
        </tr>
        {% endif %}
        <tr class="table-row-line-height sm-text">
            <td class="text-start">Module</td>
            <td class="text-end">{{vi.module_name}}
                
                </td>
        </tr>
        <div  class="text-center mb-4 align-items-center align-center" id="media-container" ></div>

    
</tbody>
</table>
